<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Prototipo · Calidad IMU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>
      #cargando { font-family: system-ui, sans-serif; max-width: 560px; margin: 18vh auto; padding: 0 16px; color: #444; }
      #cargando a { color: #0b6e4f; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cargando">
        <h2>Cargando el prototipo…</h2>
        <p>La app de Streamlit se ejecuta completamente en su navegador con Python (Pyodide). La primera carga descarga
          el entorno y entrena el modelo, y puede tardar entre 30 y 60 segundos.</p>
        <p><a href="../">← Volver a la explicación del proyecto</a></p>
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

      const archivos = [
        "app.py",
        "src/features.py",
        "src/modelo.py",
        "src/simulador.py",
        "data/indicadores_simulados.csv",
        "models/metricas.json",
        ...["ok", "perdida_paquetes", "sensor_desconectado", "sensor_sin_movimiento", "saturacion", "duplicado"].map(
          (clase) => `data/ejemplos/ejemplo_${clase}.json`,
        ),
      ];

      mount(
        {
          requirements: ["scikit-learn", "pandas", "plotly"],
          entrypoint: "app.py",
          files: Object.fromEntries(archivos.map((ruta) => [ruta, { url: `../${ruta}` }])),
          streamlitConfig: { "client.toolbarMode": "viewer" },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
